name: Tech Daily Digest

on:
  schedule:
    # 每天 UTC 1:00，北京时间 9:00
    - cron: "0 1 * * *"
  workflow_dispatch:

# 防止手动重跑和定时任务撞车，导致同一天推送两条日报
concurrency:
  group: daily-digest
  cancel-in-progress: false

# 需要写权限把数据推送到 daily-data 分支（GitHub 的默认 token 是只读的）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 兜底：避免某个数据源挂住把 job 拖到默认的 6 小时上限
    timeout-minutes: 20

    env:
      # 模块开关在 config/daily.json 里，不再占用 Secrets
      # 只有真正的凭据才放在这里
      COINGECKO_COOKIE: ${{secrets.COINGECKO_COOKIE}}
      COINGECKO_TOKEN: ${{secrets.COINGECKO_TOKEN}}
      COINMARKET_COOKIE: ${{secrets.COINMARKET_COOKIE}}
      COINMARKET_TOKEN: ${{secrets.COINMARKET_TOKEN}}
      WX_COMPANY_ID: ${{secrets.WX_COMPANY_ID}}
      WX_APP_ID: ${{secrets.WX_APP_ID}}
      WX_APP_SECRET: ${{secrets.WX_APP_SECRET}}
      BOT_KEY: ${{secrets.BOT_KEY}}
      TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
      TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
      LLM_API_KEY: ${{secrets.LLM_API_KEY}}
      LLM_BASE_URL: ${{secrets.LLM_BASE_URL}}
      LLM_MODEL: ${{secrets.LLM_MODEL}}
      DINGTALK_SECRET: ${{secrets.DINGTALK_SECRET}}
      DINGTALK_ACCESS_TOKEN: ${{secrets.DINGTALK_ACCESS_TOKEN}}
      RAPID_API_KEY: ${{secrets.RAPID_API_KEY}}
      PRODUCTHUNT_API_TOKEN: ${{secrets.PRODUCTHUNT_API_TOKEN}}
      # 默认 token 即可把 GitHub API 限额从 60/小时 提到 1000/小时
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install

      - name: run tests
        run: bun run test

      # 日报的"记忆"和归档放在独立的 daily-data 分支上，main 只保留源码。
      # 每天用「无父提交 + 强制推送」覆盖那个分支，因此它永远只有 1 个提交：
      # main 的历史不会变成一长串 chore(state)，仓库也不会每天新增一份归档副本。
      - name: restore accumulated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin daily-data 2>/dev/null; then
            git checkout origin/daily-data -- state docs/archive \
              || echo "⚠️ daily-data 存在但缺少数据目录，按空数据继续"
            echo "已恢复累积的状态与归档"
          else
            echo "daily-data 尚不存在，按首次运行处理"
          fi

      - name: run js
        run: bun run start

      # 即使日报失败，也把现场留下，方便排查
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: dist/
          retention-days: 90
          if-no-files-found: ignore

      - name: publish data
        if: always()
        run: |
          # 归档页外壳（docs/index.html）在 main 上，数据在本次工作区里，
          # 两者合起来才是完整的归档站点
          git checkout --orphan daily-data-publish
          git rm -rf --cached . >/dev/null 2>&1 || true

          for path in state docs/index.html docs/.nojekyll docs/archive; do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "无数据可发布，跳过"
            exit 0
          fi

          git commit -q -m "chore(data): $(date -u +%F) 日报状态与归档快照"
          git push --force origin HEAD:daily-data
          echo "已发布到 daily-data（该分支恒为 1 个提交）"
